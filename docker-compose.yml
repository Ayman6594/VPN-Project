version: '3.8'

services:

  # ── VPN Server (ocserv) ──────────────────────────────────────
  ocserv:
    build: ./ocserv
    container_name: vpn-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - vpn-data:/etc/ocserv
    networks:
      - vpn-net

  # ── Web Admin UI (Node.js) ───────────────────────────────────
  web-ui:
    build: ./web-ui
    container_name: vpn-web-ui
    restart: unless-stopped
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    volumes:
      - vpn-data:/etc/ocserv
    networks:
      - vpn-net
    depends_on:
      - ocserv

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vpn-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - vpn-data:/etc/nginx/certs:ro   # Reuse certs generated by ocserv
    networks:
      - vpn-net
    depends_on:
      - web-ui

volumes:
  vpn-data:   # Shared volume for certs + ocpasswd between containers

networks:
  vpn-net:
    driver: bridge
